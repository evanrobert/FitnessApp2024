# Local MySQL connection.
#
# 1. Copy this file to  config/application-local.yml  (same folder).
#    That copy is git-ignored, so your credentials never get committed.
# 2. Fill in the three values below.
# 3. Start the app on MySQL:   gradlew bootRun -Pprofile=local
#    (Windows PowerShell:      .\gradlew.bat bootRun -Pprofile=local)
#
# The first start creates all tables automatically (Flyway migrations), so point
# it at an empty database - create one with config/mysql-setup.sql in Workbench.

spring:
  datasource:
    # Change the host/port/database name if yours differ (3306 is MySQL's default).
    # allowPublicKeyRetrieval=true lets MySQL 8's default login method work over a
    # local non-SSL connection; without it you get "Public Key Retrieval is not allowed".
    url: jdbc:mysql://localhost:3306/fitness?allowPublicKeyRetrieval=true&useSSL=false
    username: fitness_app
    password: CHANGE_ME

  # Optional: real email (password reset, confirmation links, weekly summary).
  # Leave this commented out and emails are printed in the PowerShell/terminal
  # window instead, which is fine for local testing. To send real mail, uncomment
  # and use an SMTP service (e.g. your email provider's SMTP settings, or a
  # transactional service such as SendGrid, Postmark, Mailgun or Amazon SES).
  # mail:
  #   host: smtp.example.com
  #   port: 587
  #   username: CHANGE_ME
  #   password: CHANGE_ME

# app:
#   mail:
#     from: "Evan Fitness <no-reply@yourdomain.com>"
#   # "Support the developer" button: paste your Buy Me a Coffee or Ko-fi page link.
#   support:
#     url: https://buymeacoffee.com/yourname
