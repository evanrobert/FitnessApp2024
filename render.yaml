# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Secrets marked "sync: false" are entered in Render's dashboard, never committed.
services:
  - type: web
    name: evan-fitness
    runtime: docker
    # Change to "starter" (about $7/month) to stop the app sleeping after 15 idle minutes.
    plan: free
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Aiven MySQL, e.g. jdbc:mysql://HOST:PORT/defaultdb?sslMode=REQUIRED
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # The address Render gives the app, e.g. https://evan-fitness.onrender.com
      - key: APP_BASE_URL
        sync: false
      # Email over HTTPS (Render's free plan blocks SMTP). From brevo.com -> SMTP & API -> API keys.
      - key: BREVO_API_KEY
        sync: false
      # Must be a sender address verified in Brevo, e.g. "Evan Fitness <you@gmail.com>"
      - key: MAIL_FROM
        sync: false
      - key: APP_DEFAULT_TIME_ZONE
        value: America/New_York
