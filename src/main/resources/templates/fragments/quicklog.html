<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Quick log: every common entry is at most two clicks from any page. */-->

<details th:fragment="quickLog(style)" class="quick-log" th:classappend="${style == 'full'} ? 'mt-0'" th:style="${style == 'full'} ? 'margin: 4px 2px 12px'">
    <summary th:if="${style == 'full'}" class="btn btn-primary btn-block"><svg><use href="#i-plus"/></svg>Add something</summary>
    <summary th:unless="${style == 'full'}" class="icon-btn" aria-label="Add something"><svg><use href="#i-plus"/></svg></summary>
    <div class="quick-menu" role="menu" th:style="${style == 'full'} ? 'left: 0; right: auto'">
        <a href="/train/new" role="menuitem">I worked out</a>
        <a href="/fuel/new" role="menuitem">I ate something</a>
        <a href="/recover" role="menuitem">How I feel</a>
        <a href="/body#weigh-in" role="menuitem">Weigh myself</a>
        <a href="/metrics" role="menuitem">Something else I track</a>
        <hr>
        <form th:action="@{/recover/water}" method="post">
            <input type="hidden" name="ounces" value="16">
            <input type="hidden" name="returnTo" th:value="${currentPath}">
            <button type="submit" role="menuitem">I drank a glass of water <span class="hint">16 oz</span></button>
        </form>
    </div>
</details>
</body>
</html>
