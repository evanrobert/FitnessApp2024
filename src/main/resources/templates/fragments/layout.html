<!DOCTYPE html>
<!--/* App shell. Pages use:
     <html th:replace="~{fragments/layout :: page(title='Train', active='train', content=~{::content})}">
     and put their body in <th:block th:fragment="content">. */-->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, active, content)" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0c0f">
    <script src="/js/theme.js"></script>
    <title th:text="|${title} · ${brandName}|">Evan Fitness</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preload" href="/fonts/archivo-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/charts.js" defer></script>
    <script src="/js/app.js" defer></script>
</head>
<body class="app" th:with="section=${active == 'exercises' or active == 'records' ? 'train'
        : (active == 'insights' or active == 'goals' or active == 'body' or active == 'metrics' or active == 'timeline' ? 'progress'
        : (active == 'profile' or active == 'account' or active == 'export' ? 'settings' : active))}">
<svg th:replace="~{fragments/icons :: sprite}"></svg>
<a class="sr-only" href="#main">Skip to content</a>

<header class="topbar">
    <button class="icon-btn" type="button" data-nav-toggle aria-label="Open navigation"><svg><use href="#i-menu"/></svg></button>
    <a class="brand" href="/home">
        <img class="brand-mark" src="/favicon.svg" alt="" width="34" height="34">
        <span class="brand-name" th:text="${brandName}">Evan Fitness</span>
    </a>
    <th:block th:replace="~{fragments/quicklog :: quickLog('icon')}"></th:block>
    <a class="icon-btn" href="/profile" aria-label="Settings"><svg><use href="#i-settings"/></svg></a>
</header>

<aside class="rail" id="rail" aria-label="Main navigation">
    <a class="brand" href="/home">
        <img class="brand-mark" src="/favicon.svg" alt="" width="34" height="34">
        <span class="brand-name"><th:block th:text="${brandName}">Evan Fitness</th:block><small>Training ledger</small></span>
    </a>

    <th:block th:replace="~{fragments/quicklog :: quickLog('full')}"></th:block>

    <nav>
        <div class="nav-group">
            <a class="nav-link" th:classappend="${section == 'today'} ? 'is-active'" href="/home" th:attr="aria-current=${section == 'today'} ? 'page'"><svg><use href="#i-today"/></svg>Today</a>
            <a class="nav-link" th:classappend="${section == 'train'} ? 'is-active'" href="/train" th:attr="aria-current=${section == 'train'} ? 'page'"><svg><use href="#i-train"/></svg>Workouts</a>
            <a class="nav-link" th:classappend="${section == 'fuel'} ? 'is-active'" href="/fuel" th:attr="aria-current=${section == 'fuel'} ? 'page'"><svg><use href="#i-fuel"/></svg>Food</a>
            <a class="nav-link" th:classappend="${section == 'recover'} ? 'is-active'" href="/recover" th:attr="aria-current=${section == 'recover'} ? 'page'"><svg><use href="#i-recover"/></svg>Sleep &amp; mood</a>
            <a class="nav-link" th:classappend="${section == 'progress'} ? 'is-active'" href="/insights" th:attr="aria-current=${section == 'progress'} ? 'page'"><svg><use href="#i-insights"/></svg>Progress</a>
        </div>
    </nav>

    <div class="rail-footer">
        <a class="nav-link support-link" th:if="${supportUrl}" th:href="${supportUrl}" target="_blank" rel="noopener noreferrer"><svg><use href="#i-heart"/></svg>Support the developer</a>
        <button class="nav-link" type="button" data-theme-toggle><svg><use href="#i-contrast"/></svg><span data-theme-label>Light mode</span></button>
        <a class="nav-link" th:classappend="${section == 'settings'} ? 'is-active'" href="/profile"><svg><use href="#i-settings"/></svg>Settings</a>
        <form th:action="@{/logout}" method="post">
            <button class="nav-link" type="submit"><svg><use href="#i-logout"/></svg>Log out</button>
        </form>
        <div class="rail-user" sec:authorize="isAuthenticated()">
            <span class="avatar" th:text="${#strings.substring(#authentication.name, 0, 1)}">A</span>
            <span th:text="${#authentication.name}">member</span>
        </div>
    </div>
</aside>

<main class="content" id="main">
    <div class="content-inner">
        <div class="flash flash-success" th:if="${flashSuccess}" role="status"
             th:with="win=${#strings.startsWith(flashSuccess, 'Great workout!')}" th:classappend="${win} ? 'flash-win'">
            <span class="confetti" th:if="${win}" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <svg><use th:href="${win} ? '#i-trophy' : '#i-check'"/></svg><span th:text="${flashSuccess}"></span>
            <button class="flash-close" type="button" data-dismiss aria-label="Dismiss">&times;</button>
        </div>
        <div class="flash flash-error" th:if="${flashError}" role="alert">
            <svg><use href="#i-alert"/></svg><span th:text="${flashError}"></span>
            <button class="flash-close" type="button" data-dismiss aria-label="Dismiss">&times;</button>
        </div>
        <th:block th:replace="~{fragments/layout :: subnav(${section}, ${active})}"></th:block>
        <th:block th:replace="${content}"></th:block>
    </div>
</main>

<nav class="tabbar" aria-label="Primary">
    <a href="/home" th:classappend="${section == 'today'} ? 'is-active'"><svg><use href="#i-today"/></svg>Today</a>
    <a href="/train" th:classappend="${section == 'train'} ? 'is-active'"><svg><use href="#i-train"/></svg>Workouts</a>
    <a href="/fuel" th:classappend="${section == 'fuel'} ? 'is-active'"><svg><use href="#i-fuel"/></svg>Food</a>
    <a href="/recover" th:classappend="${section == 'recover'} ? 'is-active'"><svg><use href="#i-recover"/></svg>Feel</a>
    <a href="/insights" th:classappend="${section == 'progress'} ? 'is-active'"><svg><use href="#i-insights"/></svg>Progress</a>
</nav>
</body>
<!--/* Second-level tabs for sections with several pages. */-->
<nav th:fragment="subnav(section, active)" class="subnav" th:if="${section == 'train' or section == 'progress' or section == 'settings'}"
     th:attr="aria-label=${section == 'settings'} ? 'Settings' : (${section == 'train'} ? 'Workouts' : 'Progress')">
    <th:block th:if="${section == 'train'}">
        <a href="/train" th:classappend="${active == 'train'} ? 'is-active'">My workouts</a>
        <a href="/exercises" th:classappend="${active == 'exercises'} ? 'is-active'">Exercises</a>
        <a href="/records" th:classappend="${active == 'records'} ? 'is-active'">Personal bests</a>
    </th:block>
    <th:block th:if="${section == 'progress'}">
        <a href="/insights" th:classappend="${active == 'insights'} ? 'is-active'">Overview</a>
        <a href="/goals" th:classappend="${active == 'goals'} ? 'is-active'">Goals</a>
        <a href="/body" th:classappend="${active == 'body'} ? 'is-active'">Weight</a>
        <a href="/metrics" th:classappend="${active == 'metrics'} ? 'is-active'">Other tracking</a>
        <a href="/timeline" th:classappend="${active == 'timeline'} ? 'is-active'">History</a>
    </th:block>
    <th:block th:if="${section == 'settings'}">
        <a href="/profile" th:classappend="${active == 'profile'} ? 'is-active'">Profile</a>
        <a href="/account" th:classappend="${active == 'account'} ? 'is-active'">Account &amp; security</a>
        <a href="/export" th:classappend="${active == 'export'} ? 'is-active'">Export data</a>
    </th:block>
</nav>
</html>
