<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="auth-shell">
    <section class="auth-card">
        <p class="eyebrow">Start tracking</p>
        <h1>Create Account</h1>
        <p>Set up your profile so your meals, macro goals, and workouts stay connected.</p>

        <form th:action="@{/signup}" th:object="${signupForm}" method="post" novalidate>
            <div class="field">
                <label for="username">Username</label>
                <input class="input" type="text" id="username" th:field="*{username}" th:errorclass="is-invalid" placeholder="Enter your username" required autocomplete="username">
                <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input class="input" type="password" id="password" th:field="*{password}" th:errorclass="is-invalid" placeholder="Enter your password" required autocomplete="new-password">
                <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <div class="field">
                <label for="name">Name</label>
                <input class="input" type="text" id="name" th:field="*{name}" th:errorclass="is-invalid" placeholder="Enter your full name" required autocomplete="name">
                <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>

            <div class="grid form-grid">

                <div class="field with-unit">
                    <label for="weight">Weight</label>
                    <input class="input" type="number" id="weight" th:field="*{weight}" th:errorclass="is-invalid" placeholder="Optional" min="50" step="0.1">
                <p class="field-error" th:if="${#fields.hasErrors('weight')}" th:errors="*{weight}"></p>
                    <span class="unit">lb</span>
                </div>
            </div>

            <button class="btn btn-primary" type="submit">Sign Up</button>
            <a class="btn btn-ghost" href="/login">Already have an account?</a>
        </form>
    </section>
</main>
</body>
</html>
