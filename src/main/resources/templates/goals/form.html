<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(title=${goalId == null ? 'Set a goal' : 'Edit goal'}, active='goals', content=~{::content})}">
<body>
<th:block th:fragment="content">
    <header class="page-head">
        <div>
            <nav class="breadcrumb"><a href="/goals">Goals</a><span>/</span><span th:text="${goalId == null ? 'New' : 'Edit'}">New</span></nav>
            <h1 class="display" th:text="${goalId == null ? 'Set a goal' : 'Edit goal'}">Set a goal</h1>
            <p class="lede">Pick what to measure and where you want it. Leave the starting value blank and we'll read it from your latest data.</p>
        </div>
    </header>

    <form class="card ledger" method="post" th:action="${goalId == null} ? @{/goals} : @{/goals/{id}(id=${goalId})}" th:object="${goal}" novalidate style="max-width: 820px">
        <div class="flash flash-error" th:if="${#fields.hasGlobalErrors()}" style="margin:16px 20px 0"><svg><use href="#i-alert"/></svg><span th:text="${#fields.globalErrors()[0]}"></span></div>
        <div class="form-section">
            <h3>What you're aiming for</h3>
            <div class="form-grid">
                <div class="field span-all">
                    <label for="title">Goal</label>
                    <input class="input" id="title" th:field="*{title}" th:errorclass="is-invalid" placeholder="e.g. Squat 315, Get to 180 lb, Train 4× a week" required>
                    <p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
                </div>
                <div class="field">
                    <label for="metric">Measured by</label>
                    <select class="input" id="metric" th:field="*{metric}">
                        <option th:each="m : ${metricsList}" th:value="${m}" th:text="${m.label}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="exerciseId">Exercise <span class="muted">(for lift goals)</span></label>
                    <select class="input" id="exerciseId" name="exerciseId">
                        <option value="">—</option>
                        <option th:each="e : ${exercises}" th:value="${e.id}" th:text="${e.name}" th:selected="${e.id == exerciseId}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="customMetricId">Custom metric <span class="muted">(for custom goals)</span></label>
                    <select class="input" id="customMetricId" name="customMetricId">
                        <option value="">—</option>
                        <option th:each="c : ${customMetrics}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == customMetricId}"></option>
                    </select>
                    <p class="hint" th:if="${customMetrics.isEmpty()}"><a href="/metrics">Create a custom metric</a> first.</p>
                </div>
            </div>
        </div>
        <div class="form-section">
            <h3>Numbers &amp; timeline</h3>
            <div class="form-grid">
                <div class="field">
                    <label for="startValue">Starting value</label>
                    <input class="input" id="startValue" type="number" step="0.1" th:field="*{startValue}" placeholder="Auto from latest data">
                </div>
                <div class="field">
                    <label for="targetValue">Target value</label>
                    <input class="input" id="targetValue" type="number" step="0.1" th:field="*{targetValue}" th:errorclass="is-invalid" required>
                    <p class="field-error" th:if="${#fields.hasErrors('targetValue')}" th:errors="*{targetValue}"></p>
                </div>
                <div class="field"><label for="startDate">Start date</label><input class="input" id="startDate" type="date" th:field="*{startDate}"></div>
                <div class="field"><label for="targetDate">Target date <span class="muted">(optional)</span></label><input class="input" id="targetDate" type="date" th:field="*{targetDate}">
                    <p class="hint">With a date we can tell you if you're on pace.</p></div>
                <div class="field span-all"><label for="notes">Why it matters</label><textarea class="input" id="notes" th:field="*{notes}" placeholder="Optional: the reason, the plan, the reward"></textarea></div>
            </div>
        </div>
        <div class="form-actions"><a class="btn btn-ghost spacer" href="/goals">Cancel</a><button class="btn btn-primary" type="submit" th:text="${goalId == null ? 'Set goal' : 'Save goal'}">Set goal</button></div>
    </form>
</th:block>
</body>
</html>
