<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/base :: email(~{::content})}">
<body>
<th:block th:fragment="content">
    <p style="margin:0 0 14px;">Hi <span th:text="${name}">there</span>,</p>
    <p style="margin:0 0 20px;">Confirm this email address so you can reset your password if you forget it, and get the weekly summary if you choose to.</p>
    <p style="margin:0 0 24px;"><a th:href="${link}" href="#" style="display:inline-block;background:#1e90ff;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 22px;">Confirm email</a></p>
    <p style="margin:0 0 8px;font-size:13px;color:#6d675e;">The link works for 24 hours. If you didn't create an account, ignore this email.</p>
    <p style="margin:0 0 16px;font-size:12px;color:#6d675e;word-break:break-all;">Button not working? Paste this into your browser: <span th:text="${link}">link</span></p>
</th:block>
</body>
</html>
