<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/base :: email(~{::content})}">
<body>
<th:block th:fragment="content">
    <p style="margin:0 0 14px;">Hi <span th:text="${name}">there</span>,</p>
    <p style="margin:0 0 14px;">The password for your account was just changed, and other devices were signed out.</p>
    <p style="margin:0 0 20px;">If that was you, there's nothing to do.</p>
    <p style="margin:0 0 8px;"><strong>Wasn't you?</strong> Reset your password right away:</p>
    <p style="margin:0 0 24px;"><a th:href="${link}" href="#" style="display:inline-block;background:#0b0b0b;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 22px;">Reset password</a></p>
</th:block>
</body>
</html>
