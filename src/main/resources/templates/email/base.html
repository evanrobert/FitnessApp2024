<!DOCTYPE html>
<!--/* Shared email frame. Inline styles and tables only: email clients ignore stylesheets. */-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="email(content)" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title th:text="${subject}">Email</title>
</head>
<body style="margin:0;padding:0;background:#f6f3ed;font-family:Arial,Helvetica,sans-serif;color:#0b0b0b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f3ed;">
    <tr><td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e5ded2;">
            <tr><td style="background:#0b0b0b;padding:18px 24px;border-bottom:3px solid #1e90ff;">
                <span style="color:#ffffff;font-weight:bold;font-size:16px;letter-spacing:1px;text-transform:uppercase;" th:text="${brandName}">Evan Fitness</span>
            </td></tr>
            <tr><td style="padding:28px 24px 8px;font-size:15px;line-height:1.55;">
                <th:block th:replace="${content}"></th:block>
            </td></tr>
            <tr><td style="padding:16px 24px 24px;font-size:12px;line-height:1.5;color:#6d675e;border-top:1px solid #e5ded2;">
                This email was sent by <span th:text="${brandName}">Evan Fitness</span>. We never ask for your password by email.
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
