# Base configuration shared by every profile.
# Database credentials are never committed: supply them through environment
# variables (see README) or run with the "dev" profile for an in-memory database.
spring:
  application:
    name: evan-fitness
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fitness}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # Existing databases created by the legacy app (Hibernate ddl-auto) have no
    # Flyway history. Baseline them at V1 (the legacy schema) and apply V2+.
    baseline-on-migrate: true
    baseline-version: 1
  thymeleaf:
    cache: true
  servlet:
    multipart:
      enabled: false

server:
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  brand-name: ${APP_BRAND_NAME:Evan Fitness}
  default-time-zone: ${APP_DEFAULT_TIME_ZONE:America/New_York}
