# Base configuration shared by every profile.
# Database credentials are never committed: supply them through environment
# variables (see README) or run with the "dev" profile for an in-memory database.
spring:
  application:
    name: evan-fitness
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fitness}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    # Server-rendered views read lazy associations; batch fetching keeps that N+1-safe.
    open-in-view: true
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 64
  flyway:
    # Existing databases created by the legacy app (Hibernate ddl-auto) have no
    # Flyway history. Baseline them at V1 (the legacy schema) and apply V2+.
    baseline-on-migrate: true
    baseline-version: 1
  thymeleaf:
    cache: true
  servlet:
    multipart:
      enabled: false
  # Email: set SPRING_MAIL_HOST (plus SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD)
  # to send real mail. Without a host nothing is sent; dev/local print messages to the console.
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  # Hosts like Render tell the app which port to use through PORT.
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        # Set SESSION_COOKIE_SECURE=true whenever the app is served over HTTPS (recommended in production).
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  brand-name: ${APP_BRAND_NAME:Evan Fitness}
  default-time-zone: ${APP_DEFAULT_TIME_ZONE:America/New_York}
  # Public address of the app, used for links in emails (never taken from the request's Host header).
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:Evan Fitness <no-reply@localhost>}
    # Brevo (brevo.com) sends over HTTPS, for hosts that block SMTP such as Render's free plan.
    # When set it's used instead of SMTP.
    brevo-api-key: ${BREVO_API_KEY:}
  support:
    # Optional "Support the developer" link (e.g. https://buymeacoffee.com/yourname or
    # https://ko-fi.com/yourname). Must be https. Set APP_SUPPORT_URL to an empty value to hide the button.
    url: ${APP_SUPPORT_URL:https://buymeacoffee.com/EvanLindsay}
  # Usernames (comma-separated) who can open the usage report at /admin/usage. Empty = nobody.
  admin-usernames: ${ADMIN_USERNAMES:}
  weekly-email:
    # Local hour on Mondays when opted-in members get last week's summary.
    hour: 7
  security:
    max-failed-logins: 5
    lockout: 15m

---
# "local" profile (your own MySQL, credentials in config/application-local.yml).
# Until SMTP is configured there, emails, including password reset and confirmation
# links, are printed to the console instead of sent.
spring:
  config:
    activate:
      on-profile: local
app:
  mail:
    log-contents: true

---
# "prod" profile: the hosted app (e.g. Render), behind the host's HTTPS proxy.
# Set SPRING_PROFILES_ACTIVE=prod plus DB_URL, DB_USERNAME, DB_PASSWORD, APP_BASE_URL and the
# SPRING_MAIL_* settings as secrets on the host.
spring:
  config:
    activate:
      on-profile: prod
server:
  # Trust the host's proxy for the client address and https scheme, so per-IP sign-in
  # limits apply per visitor, links and redirects use https, and HSTS is sent.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
app:
  mail:
    log-contents: false
